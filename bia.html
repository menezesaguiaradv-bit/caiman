<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0505">
<link rel="manifest" href="bia-manifest.json">
<link rel="icon" href="bia-icon-192.png">
<link rel="apple-touch-icon" href="bia-icon-192.png">
<title>Bia</title>
<link rel="icon" type="image/png" href="icon-192.png">
<!-- 27/10/2026 (ele: "Quero criar a Bia virtual: uma pagina propria, interativa, no estilo do JARVIS, onde eu converso
     com a Bia por texto e voz e vejo a operacao inteira na tela"). Visual JARVIS, fala natural (a Bia de sempre).
     Cerebro = Edge Function Bia, rota ?web=1 (so leitura). Login = o mesmo do app (Supabase Auth) + o PIN do app.
     Nenhuma chave secreta aqui: a chave anon do app e publica; Anthropic, OpenAI e service key ficam no Supabase. -->
<style>
:root{
  /* 05/11 (ele: "quero que a capa do app seja Friday. E seja nas cores do homem de ferro"): vermelho e dourado */
  --vd:#9E1B1B; --dou:#E8B54A; --cre:#FFF4DC;
  --fundo:#0E0505; --fundo2:#180808; --cartao:#1E0B0B; --borda:#43191A;
  --tx:#FFF4E6; --tx2:#E3C9B8; --tx3:#A88C84;
  --linha-dia:#E8B54A; --linha-acum:#E0453A; --alerta:#FF8A5C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fundo);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}

/* ---------- entrada (login e PIN) ---------- */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 30%,#4A0F10 0,#1C0707 38%,var(--fundo) 72%)}
.gcx{width:100%;max-width:360px;text-align:center}
.gcx img{width:220px;max-width:70%;filter:brightness(0) invert(.94) sepia(.15);opacity:.9;margin-bottom:28px}
.gcx h1{font-weight:500;font-size:20px;margin:0 0 6px;letter-spacing:.04em}
#g-login h1{font-weight:800;font-size:44px;margin:0 0 4px;letter-spacing:.32em;padding-left:.32em;background:linear-gradient(180deg,#FFE3A1,#E8B54A 55%,#B07A1E);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 28px rgba(232,181,74,.25)}
.gcx .marca{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--tx3);margin:0 0 22px}
.gcx p{color:var(--tx2);font-size:14px;margin:0 0 20px}
.campo{width:100%;height:56px;border-radius:14px;border:1px solid var(--borda);background:var(--cartao);color:var(--tx);font-size:17px;padding:0 16px;margin-bottom:12px;outline:none}
.campo:focus{border-color:var(--dou)}
.btg{width:100%;height:56px;border-radius:14px;border:none;background:var(--dou);color:#1A1307;font-size:17px;font-weight:600}
.erro{color:var(--alerta);font-size:14px;min-height:20px;margin-top:10px}
.dots{display:flex;gap:16px;justify-content:center;margin:8px 0 22px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--dou)}
.dot.on{background:var(--dou)}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.teclado button{height:64px;border-radius:16px;border:1px solid var(--borda);background:var(--cartao);color:var(--tx);font-size:24px}
.teclado button:active{background:var(--borda)}
.link{background:none;border:none;color:var(--tx2);text-decoration:underline;font-size:14px;margin-top:18px;padding:10px}

/* ---------- palco ---------- */
#app{min-height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px calc(112px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;height:56px}
.hmarca{display:flex;align-items:center;gap:12px}
.hmarca b{font-size:20px;font-weight:800;letter-spacing:.28em;background:linear-gradient(180deg,#FFE3A1,#E8B54A 55%,#B07A1E);-webkit-background-clip:text;background-clip:text;color:transparent}
header img{height:22px;filter:brightness(0) invert(.94) sepia(.15);opacity:.55}
#aovivo{border-color:var(--dou);color:var(--dou);font-weight:600}
#aovivo.on{background:var(--vd);color:#fff;border-color:#FF6B5B;box-shadow:0 0 0 4px rgba(255,107,91,.2)}
.hbt{min-width:48px;height:48px;border-radius:12px;border:1px solid var(--borda);background:transparent;color:var(--tx2);font-size:14px;padding:0 12px}
/* celular: nucleo em cima, a resposta logo abaixo e os seis paineis em grade 2 x 3 */
#palco{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
#centro{grid-column:1/-1;order:1}
#tiles-a,#tiles-b{display:contents}
#tiles-a .tile,#tiles-b .tile{order:2}
#nucleo{position:relative;width:min(78vw,40vh,440px);aspect-ratio:1;margin:0 auto}
#nucleo canvas{width:100%;height:100%;display:block}
#estado{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--dou)}
.tile{position:relative;min-height:92px;text-align:left;border-radius:16px;border:1px solid var(--borda);background:linear-gradient(160deg,var(--cartao),var(--fundo2));color:var(--tx);padding:12px 14px;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--dou);opacity:.7}
.tile.ativo{border-color:var(--dou);box-shadow:0 0 0 1px var(--dou),0 0 24px rgba(232,181,74,.28)}
.tile .t{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}
.tile .v{font-size:20px;font-weight:600;margin-top:6px;line-height:1.15}
.tile .s{font-size:12.5px;color:var(--tx2);margin-top:4px;line-height:1.3}
.tile .alerta{color:var(--alerta)}
#conversa{max-width:760px;width:100%;margin:4px auto 14px;text-align:center}
#ouvido{color:var(--tx3);font-size:15px;min-height:20px;font-style:italic}
#resposta{font-size:18px;line-height:1.5;margin-top:8px;color:var(--tx);white-space:pre-wrap}
@media (min-width:760px){
  #palco{grid-template-columns:1fr minmax(320px,440px) 1fr;gap:24px;align-items:center}
  #tiles-a,#tiles-b{display:grid;grid-template-columns:1fr;gap:12px;order:0}
  #tiles-a{order:1}#centro{grid-column:auto;order:2}#tiles-b{order:3}
  #nucleo{width:100%}
}

/* ---------- barra de conversa ---------- */
#barra{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--fundo) 70%,rgba(14,5,5,0));display:flex;gap:10px;align-items:center;justify-content:center}
#barra .grupo{display:flex;gap:10px;align-items:center;width:100%;max-width:760px}
#txt{flex:1;height:56px;border-radius:28px;border:1px solid var(--borda);background:var(--cartao);color:var(--tx);font-size:16px;padding:0 20px;outline:none;min-width:0}
#txt:focus{border-color:var(--dou)}
.rnd{flex:none;width:56px;height:56px;border-radius:50%;border:1px solid var(--borda);background:var(--cartao);color:var(--tx);display:flex;align-items:center;justify-content:center}
#mic{width:76px;height:76px;background:var(--vd);border:2px solid var(--dou)}
#mic.ouvindo{background:var(--dou);color:#1A1307;box-shadow:0 0 0 8px rgba(232,181,74,.2)}
#voz.off{opacity:.45}
.rnd svg{width:26px;height:26px}
#mic svg{width:32px;height:32px}

/* ---------- painel em tela cheia ---------- */
#tela{position:fixed;inset:0;z-index:20;background:var(--fundo);display:flex;flex-direction:column}
#tela .cab{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--borda)}
#tela h2{flex:1;margin:0;font-size:18px;font-weight:600;letter-spacing:.04em}
#tela .sub{font-size:12.5px;color:var(--tx3);font-weight:400;letter-spacing:0;margin-top:2px}
#fechar{height:52px;padding:0 20px;border-radius:14px;border:1px solid var(--dou);background:transparent;color:var(--cre);font-size:16px}
#corpo{flex:1;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{border:1px solid var(--borda);border-radius:16px;background:var(--cartao);padding:14px 16px}
.card.foco{border-color:var(--dou);box-shadow:0 0 0 1px var(--dou)}
.card h3{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.card h3 small{font-size:12.5px;color:var(--tx3);font-weight:400}
.met{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px}
.met div{font-size:11px;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase}
.met b{display:block;font-size:17px;color:var(--tx);letter-spacing:0;text-transform:none;font-weight:600;margin-top:3px}
.tab{width:100%;border-collapse:collapse;font-size:14.5px}
.tab th{text-align:left;font-weight:500;color:var(--tx3);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--borda)}
.tab td{padding:10px 6px;border-bottom:1px solid #2A1010}
.tab .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sec{margin:22px 0 10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dou)}
.aviso{color:var(--tx2);font-size:14px;line-height:1.5}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--borda);color:var(--tx2)}
.tag.al{border-color:var(--alerta);color:var(--alerta)}
.leg{display:flex;gap:16px;font-size:12.5px;color:var(--tx2);margin:2px 0 10px;flex-wrap:wrap}
.leg i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.graf{position:relative}
.graf svg{width:100%;height:auto;display:block}
.dica{position:absolute;pointer-events:none;background:#120606;border:1px solid var(--borda);border-radius:10px;padding:6px 10px;font-size:12.5px;color:var(--tx);white-space:nowrap;transform:translate(-50%,-110%)}
.chk{list-style:none;padding:0;margin:0}
.chk li{padding:12px 0;border-bottom:1px solid #2A1010;font-size:15.5px;line-height:1.45;display:flex;gap:12px}
.chk li::before{content:"";flex:none;width:18px;height:18px;margin-top:3px;border-radius:5px;border:2px solid var(--dou)}
.selo{position:fixed;right:8px;bottom:2px;font-size:10px;color:#5A3030;z-index:1}
@media (prefers-reduced-motion:reduce){#mic.ouvindo{box-shadow:none}}
/* ---------- 08/11 (ele: "coloque o app da bia dentro do aplicativo ... mantenha o layout do app, mesmas cores do nosso
   app verde"): com ?tema=app a pagina veste as cores do Caiman Gestao (verde-escuro, creme e dourado). O site da Bia
   e o app Android continuam vermelho e dourado. ---------- */
html.tema-app{--vd:#23432D;--dou:#B8944F;--cre:#F7F4EC;--fundo:#F7F4EC;--fundo2:#EFEADB;--cartao:#FFFEFA;--borda:#E3DCC8;
  --tx:#1F241F;--tx2:#4A4F45;--tx3:#7A7668;--linha-dia:#23432D;--linha-acum:#B8944F;--alerta:#A32D2D}
html.tema-app #gate{background:var(--fundo)}
html.tema-app .gcx img{filter:none;opacity:1}
html.tema-app #g-login h1,html.tema-app .hmarca b{background:none;-webkit-background-clip:initial;background-clip:initial;color:#23432D;text-shadow:none}
html.tema-app .btg{background:#23432D;color:#F7F4EC}
html.tema-app header img{filter:none;opacity:1;height:24px}
html.tema-app #aovivo{border-color:#23432D;color:#23432D;background:#fff}
html.tema-app #aovivo.on{background:#23432D;color:#F7F4EC;border-color:#23432D;box-shadow:0 0 0 4px rgba(35,67,45,.18)}
html.tema-app .hbt{background:#fff;color:#23432D}
html.tema-app #estado{color:#23432D;font-weight:600}
html.tema-app .tile{background:#FFFEFA;box-shadow:0 1px 2px rgba(35,67,45,.06)}
html.tema-app .tile::before{background:#23432D;opacity:1}
html.tema-app .tile.ativo{border-color:#23432D;box-shadow:0 0 0 1px #23432D}
html.tema-app #barra{background:linear-gradient(0deg,var(--fundo) 70%,rgba(247,244,236,0))}
html.tema-app #mic{background:#23432D;border-color:#B8944F;color:#F7F4EC}
html.tema-app #mic.ouvindo{background:#B8944F;color:#fff;box-shadow:0 0 0 8px rgba(184,148,79,.22)}
html.tema-app .rnd{background:#fff;color:#23432D}
html.tema-app #fechar{border-color:#23432D;color:#23432D;background:#fff}
html.tema-app .sec{color:#23432D;font-weight:700}
html.tema-app .card.foco{border-color:#23432D;box-shadow:0 0 0 1px #23432D}
html.tema-app .tab td,html.tema-app .chk li{border-bottom-color:#EFE8D6}
html.tema-app .chk li::before{border-color:#23432D}
html.tema-app .dica{background:#fff;color:#1F241F;box-shadow:0 2px 8px rgba(0,0,0,.12)}
html.tema-app .graf svg text{fill:#7A7668}
html.tema-app .graf svg line[stroke="#2E1212"]{stroke:#EDE6D3}
html.tema-app .graf svg line[stroke="#6B3A36"]{stroke:#B8944F}
html.tema-app .selo{display:none}
/* no app a barra verde de cima ja tem o nome e o "Falar ao vivo": tira os repetidos */
html.tema-app .hmarca,html.tema-app #aovivo{display:none}
html.tema-app header{height:46px;justify-content:flex-end}
/* 09/11 (ele: "quero poder trabalhar no app e com a bia ao mesmo tempo"): modo COMPACTO, usado quando a Bia fica
   encaixada embaixo do app no celular - nucleo pequeno a esquerda, a fala dela ao lado, a barra embaixo. */
html.compacto #app{padding:6px 10px 70px;min-height:0}
html.compacto header,html.compacto #tiles-a,html.compacto #tiles-b{display:none!important}
html.compacto #palco{display:flex;gap:10px;align-items:center}
html.compacto #centro{display:flex;gap:10px;align-items:center;width:100%}
html.compacto #nucleo{width:92px;height:92px;flex:none;margin:0}
html.compacto #estado{font-size:8.5px;letter-spacing:.12em;bottom:-2px}
html.compacto #conversa{margin:0;text-align:left;flex:1;min-width:0;max-height:118px;overflow:auto}
html.compacto #ouvido{font-size:12px;min-height:0}
html.compacto #resposta{font-size:14px;line-height:1.4;margin-top:2px}
html.compacto #barra{padding:6px 10px calc(6px + env(safe-area-inset-bottom));gap:8px}
html.compacto #barra .grupo{gap:8px}
html.compacto #txt{height:44px;font-size:15px;padding:0 14px}
html.compacto .rnd{width:44px;height:44px}
html.compacto #mic{width:52px;height:52px}
html.compacto .rnd svg{width:21px;height:21px}
html.compacto #mic svg{width:24px;height:24px}
</style>
<script>try{if(/[?&]tema=app\b/.test(location.search))document.documentElement.classList.add("tema-app");}catch(e){}</script>
</head>
<body>

<div id="gate">
  <div class="gcx">
    <img src="bia-logo.png" alt="Grupo Caiman Agro">
    <div id="g-login">
      <h1>BIA</h1>
      <p>Entre com o mesmo usuário e senha do app.</p>
      <input class="campo" id="g-user" autocomplete="username" placeholder="Usuário" autocapitalize="none">
      <input class="campo" id="g-senha" type="password" autocomplete="current-password" placeholder="Senha">
      <button class="btg" id="g-entrar">Entrar</button>
      <div class="erro" id="g-erro"></div>
    </div>
    <div id="g-pin" hidden>
      <h1>Digite seu PIN</h1>
      <p>O mesmo PIN do app.</p>
      <div class="dots" id="g-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <div class="teclado" id="g-tec"></div>
      <div class="erro" id="g-perro"></div>
      <button class="link" id="g-senha-link">Esqueci o PIN — entrar com a senha</button>
    </div>
  </div>
</div>

<main id="app" hidden>
  <header>
    <div class="hmarca"><b>BIA</b><img src="bia-logo.png" alt="Grupo Caiman Agro"></div>
    <div style="display:flex;gap:8px"><button class="hbt" id="aovivo" aria-label="Conversa ao vivo">● Ao vivo</button>
    <button class="hbt" id="atualizar" aria-label="Atualizar painéis">Atualizar</button></div>
  </header>
  <section id="palco">
    <div class="tiles" id="tiles-a"></div>
    <div id="centro">
      <div id="nucleo"><canvas id="cv"></canvas><div id="estado">Pronta</div></div>
      <div id="conversa">
        <div id="ouvido"></div>
        <div id="resposta">Oi, chefe! Toque no microfone e fala comigo, ou escreve aqui embaixo.</div>
      </div>
    </div>
    <div class="tiles" id="tiles-b"></div>
  </section>
</main>

<div id="barra" hidden>
  <div class="grupo">
    <button class="rnd" id="voz" aria-label="Resposta falada ligada" title="Resposta falada">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <input id="txt" placeholder="Pergunte à Bia" enterkeyhint="send" autocomplete="off">
    <button class="rnd" id="enviar" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </button>
    <button class="rnd" id="mic" aria-label="Falar com a Bia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
    </button>
  </div>
</div>

<div id="tela" hidden role="dialog" aria-modal="true">
  <div class="cab"><h2 id="t-tit"></h2><button id="fechar">Fechar</button></div>
  <div id="corpo"></div>
</div>
<div class="selo">v2026.11.09-compacto</div>

<script>
"use strict";
/* ===== conexao (mesmo projeto e mesma chave publica do app) ===== */
let SB_URL="https://qrsabbvkztfsxoxvaiwm.supabase.co";
let SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyc2FiYnZrenRmc3hveHZhaXdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NDgzODAsImV4cCI6MjA5NDMyNDM4MH0.qUlcuhhcH7QPF3Ro142lXaid_yHwmBykAbCzMgxMITA";
try{const u=localStorage.getItem("sb_url");if(u)SB_URL=u;const k=localStorage.getItem("sb_key");if(k&&k.split(".").length===3)SB_KEY=k;}catch(e){}
const BIA=()=>SB_URL+"/functions/v1/Bia";
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=(v,d)=>v==null||!isFinite(v)?"—":Number(v).toLocaleString("pt-BR",{minimumFractionDigits:d||0,maximumFractionDigits:d||0});
const rs=(v)=>v==null?"—":"R$ "+nf(v,0);
const brData=(iso)=>{if(!iso)return"—";const p=String(iso).slice(0,10).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso;};
const brCurto=(iso)=>brData(iso).slice(0,5);

/* ===== sessao: a MESMA do app (_cag_sess), com a mesma renovacao (os tokens rotacionam: copia velha derruba) ===== */
function _jwtOk(t){return typeof t==="string"&&t.split(".").length===3;}
function _sessao(){
  try{
    const a=JSON.parse(sessionStorage.getItem("_cag_sess")||"null"),b=JSON.parse(localStorage.getItem("_cag_sess")||"null");
    if(!a&&!b)return null;
    const fA=(a&&(a.atualizadoEm||a.expira))||0,fB=(b&&(b.atualizadoEm||b.expira))||0;
    const s=(fA>=fB)?(a||b):(b||a);
    try{sessionStorage.setItem("_cag_sess",JSON.stringify(s));}catch(e){}
    return s;
  }catch(e){return null;}
}
function _salvarSessao(s,persistir){
  const txt=JSON.stringify(s);
  try{sessionStorage.setItem("_cag_sess",txt);}catch(e){}
  if(persistir){try{localStorage.setItem("_cag_sess",txt);}catch(e){}}
}
let _renovando=null;
async function token(){
  const s=_sessao(); if(!s)return null;
  if(s.sessaoExpira&&Date.now()>s.sessaoExpira)return null;
  if(_jwtOk(s.access_token)&&Date.now()<(s.expira||0)-60000)return s.access_token;
  if(_renovando)return _renovando;
  _renovando=(async()=>{
    try{
      const r=await fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})});
      if(!r.ok)return (r.status===400||r.status===401)?null:(s.access_token||null);
      const j=await r.json();
      const nova={usuario:s.usuario,email:(j.user&&j.user.email)||s.email,access_token:j.access_token,refresh_token:j.refresh_token,
        expira:Date.now()+(j.expires_in||3600)*1000,sessaoExpira:s.sessaoExpira||null,manter:s.manter||false,atualizadoEm:Date.now()};
      _salvarSessao(nova,!!nova.manter||!!localStorage.getItem("_cag_sess"));
      return nova.access_token;
    }catch(e){return s.access_token||null;}
  })();
  const t=await _renovando; _renovando=null; return t;
}
async function entrar(){
  const u=$("g-user").value.trim().toLowerCase(),p=$("g-senha").value;
  const err=$("g-erro"); err.textContent="";
  if(!u||!p){err.textContent="Preencha usuário e senha.";return;}
  const email=u.includes("@")?u:u+"@caimanagro.app";
  $("g-entrar").disabled=true;
  try{
    const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password:p})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.access_token){err.textContent="Usuário ou senha incorretos.";return;}
    _salvarSessao({usuario:u.split("@")[0],email,access_token:j.access_token,refresh_token:j.refresh_token,expira:Date.now()+(j.expires_in||3600)*1000,
      manter:true,sessaoExpira:Date.now()+30*24*3600e3,atualizadoEm:Date.now()},true);
    try{sessionStorage.setItem("_bia_pin_ok","1");}catch(e){}   /* entrou com a senha: nao pede o PIN de novo nesta aba */
    $("g-senha").value=""; abrirApp();
  }catch(e){err.textContent="Sem conexão com o servidor.";}
  finally{$("g-entrar").disabled=false;}
}

/* ===== PIN: o mesmo do app (mesmo hash, mesmo site) ===== */
function _pinHash(p){let h=5381;const s=p+"|caiman|"+location.hostname;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}return h.toString(16);}
let pinBuf="";
function montarTeclado(){
  const t=$("g-tec"); t.innerHTML="";
  ["1","2","3","4","5","6","7","8","9","","0","apagar"].forEach((k)=>{
    const b=document.createElement("button");
    if(!k){b.style.visibility="hidden";} else if(k==="apagar"){b.textContent="Apagar";b.style.fontSize="15px";b.onclick=()=>{pinBuf=pinBuf.slice(0,-1);pontos();};}
    else{b.textContent=k;b.onclick=()=>digito(k);}
    t.appendChild(b);
  });
}
function pontos(){document.querySelectorAll("#g-dots .dot").forEach((d,i)=>d.classList.toggle("on",i<pinBuf.length));}
function digito(d){
  if(pinBuf.length>=4)return; pinBuf+=d; pontos(); $("g-perro").textContent="";
  if(pinBuf.length===4){
    let ok=false; try{ok=_pinHash(pinBuf)===localStorage.getItem("_cag_pin");}catch(e){}
    if(ok){pinBuf="";pontos();try{sessionStorage.setItem("_bia_pin_ok","1");}catch(e){}abrirApp();}
    else{pinBuf="";setTimeout(pontos,150);$("g-perro").textContent="PIN incorreto. Tente de novo.";}
  }
}
function pinAtivo(){try{return !!localStorage.getItem("_cag_pin")&&sessionStorage.getItem("_bia_pin_ok")!=="1";}catch(e){return false;}}

function mostrarGate(modo){
  $("gate").hidden=false; $("app").hidden=true; $("barra").hidden=true;
  $("g-login").hidden=modo!=="login"; $("g-pin").hidden=modo!=="pin";
  if(modo==="pin"){pinBuf="";pontos();montarTeclado();}
}
async function iniciar(){
  const t=await token();
  if(!t){mostrarGate("login");return;}
  if(pinAtivo()){mostrarGate("pin");return;}
  abrirApp();
}
function abrirApp(){
  $("gate").hidden=true; $("app").hidden=false; $("barra").hidden=false;
  desenharTiles(); carregarTudo();
  /* 31/10 (ele: "quando eu disser Bia, ela abre e comeca a falar comigo"): aberta pelo atalho/palavra de ativacao
     (?ouvir=1, start_url do app instalado), ja comeca ouvindo e fica em MODO CONVERSA: depois de responder,
     volta a ouvir sozinha; para quando ele fica em silencio ou diz "obrigado/tchau/pode parar". */
  if(MODO_CONVERSA)setTimeout(()=>{if(!ouvindo&&!ocupado)ouvir();},400);

/* ===== chamadas a Bia ===== */
async function chamar(qs,corpo){
  const t=await token();
  if(!t){mostrarGate("login");throw new Error("login");}
  const r=await fetch(BIA()+"?"+qs,{method:corpo?"POST":"GET",headers:{apikey:SB_KEY,Authorization:"Bearer "+t,"Content-Type":"application/json"},body:corpo?JSON.stringify(corpo):undefined});
  const j=await r.json().catch(()=>({ok:false,erro:"resposta inválida ("+r.status+")"}));
  if(r.status===401){$("g-erro").textContent=j.erro||"Entre com o seu login do app.";mostrarGate("login");throw new Error("login");}
  return j;
}

const DADOS={};
function desenharTiles(){
  const tile=(k)=>{const d=DADOS[k],r=d&&d.ok?resumo(k,d):{v:d&&!d.ok?"indisponível":"carregando…",s:d&&d.erro?d.erro:""};
    return '<button class="tile" data-p="'+k+'"><div class="t">'+PAINEIS[k].tit+'</div><div class="v">'+r.v+'</div><div class="s">'+(r.s||"")+'</div></button>';};

function resumo(k,d){
  if(k==="currais"){const c=d.currais||[];const cab=c.reduce((t,x)=>t+(x.cabecas||0),0);const p=c.find((x)=>x.dias_abate!=null);
    return {v:nf(cab)+" cabeças",s:p?"Próximo abate: "+esc(p.curral)+" em "+p.dias_abate+" dias":""};}
  if(k==="megacaloria"){const r=d.resumo;if(!r)return {v:"—",s:"sem tratos fechados ontem"};
    return {v:nf(r.pct,0)+"% da meta",s:r.atencao.length?'<span class="alerta">Atenção: '+esc(r.atencao.join(", "))+"</span>":"Nenhum curral com a dourada abaixo da verde"};}
  if(k==="estoque"){const l=(d.linhas||[]).filter((x)=>x.dur_cor!=null).sort((a,b)=>a.dur_cor-b.dur_cor)[0];
    return l?{v:esc(l.produto),s:"o que acaba primeiro: "+nf(l.dur_cor)+" dias ("+brCurto(maisDias(l.dur_cor))+")"}:{v:"—",s:""};}
  if(k==="financeiro"){const c=d.contas||[];const tot=c.reduce((t,x)=>t+(+x.valor||0),0);const v=c.filter((x)=>x.situacao==="vencida").length;
    return {v:rs(tot),s:c.length+" conta(s) até 7 dias"+(v?' · <span class="alerta">'+v+" vencida(s)</span>":"")};}
  if(k==="mercado"){const m=d.mercado||{},f=(d.futuros||[])[0];
    return {v:m.preco_ms?"R$ "+nf(m.preco_ms,2):"—",s:"Datagro MS"+(f?" · B3 "+esc(f.codigo)+" R$ "+nf(f.preco,2):"")};}
  if(k==="cerebro"){return {v:(d.pendencias||[]).length+" pendências",s:(d.decisoes&&d.decisoes[0])?"Última decisão: "+esc(d.decisoes[0].data):""};}
  return {v:"—",s:""};
}
function maisDias(n){const d=new Date();d.setDate(d.getDate()+Number(n||0));return d.toISOString().slice(0,10);}
async function carregar(k){try{DADOS[k]=await chamar("web=1&painel="+k);}catch(e){if(e.message!=="login")DADOS[k]={ok:false,erro:"sem conexão"};}desenharTiles();if(painelAberto===k)renderPainel(k);}
function carregarTudo(){Object.keys(PAINEIS).forEach((k)=>{delete DADOS[k];});desenharTiles();Object.keys(PAINEIS).forEach(carregar);}

/* megacaloria: dourada = % da meta no dia; verde (tracejada) = acumulado do ciclo; ponto de atencao = dourada abaixo da verde */
let SERIES=[];
function pMega(d){
  SERIES=(d.currais||[]).filter((x)=>x.serie&&x.serie.length);
  if(!SERIES.length)return '<p class="aviso">Sem série de energia ainda.</p>';
  const r=d.resumo;

  h+='<div class="leg"><span><i style="border-color:var(--linha-dia)"></i>Energia do dia (% da meta)</span><span><i style="border-color:var(--linha-acum);border-top-style:dashed"></i>Acumulado do ciclo</span><span><i style="border-color:#6B3A36;border-top-style:dotted"></i>Meta 100%</span></div>';
  h+='<div class="grade">'+SERIES.map((x,i)=>'<div class="card'+(focoCurral===x.curral?" foco":"")+'" data-curral="'+esc(x.curral)+'"><h3>'+esc(x.curral)+"<small>"+nf(x.energia_dia,0)+"% · acum. "+nf(x.energia_acum,0)+"%"+(x.dias_dourada_abaixo?' · <span style="color:var(--alerta)">atenção</span>':"")+'</small></h3><div class="graf" data-i="'+i+'">'+svgSerie(x)+"</div></div>").join("")+"</div>";
  return h;

function svgSerie(x){
  const W=320,H=150,L=34,R=34,T=10,B=22,s=x.serie,n=s.length;
  const vals=s.flatMap((p)=>[p[1],p[2]]).concat([100]);
  let lo=Math.min(...vals),hi=Math.max(...vals);lo=Math.floor((lo-5)/10)*10;hi=Math.ceil((hi+5)/10)*10;
  const X=(i)=>L+(n<2?0:(W-L-R)*i/(n-1)),Y=(v)=>T+(H-T-B)*(1-(v-lo)/(hi-lo||1));
  const path=(k)=>s.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p[k]).toFixed(1)).join("");
  let g="";
  for(let v=lo;v<=hi;v+=Math.max(10,Math.round((hi-lo)/40)*10)){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#2E1212" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" fill="#A88C84" font-size="10" text-anchor="end">'+v+"</text>";}
  /* dias com a dourada abaixo da verde: faixa discreta no fundo */
  let faixa="";
  s.forEach((p,i)=>{if(p[1]<p[2]){const w=n<2?6:(W-L-R)/(n-1);faixa+='<rect x="'+(X(i)-w/2)+'" y="'+T+'" width="'+w+'" height="'+(H-T-B)+'" fill="rgba(224,123,90,.10)"/>';}});
  const u=s[n-1];
  return '<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Energia do '+esc(x.curral)+'">'+faixa+g+
    '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(100)+'" y2="'+Y(100)+'" stroke="#6B3A36" stroke-width="1.5" stroke-dasharray="2 4"/>'+
    '<path d="'+path(2)+'" fill="none" stroke="var(--linha-acum)" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>'+
    '<path d="'+path(1)+'" fill="none" stroke="var(--linha-dia)" stroke-width="2" stroke-linejoin="round"/>'+
    '<circle cx="'+X(n-1)+'" cy="'+Y(u[1])+'" r="4" fill="var(--linha-dia)" stroke="var(--cartao)" stroke-width="2"/>'+
    '<text x="'+(X(n-1)+6)+'" y="'+(Y(u[1])+(u[1]<u[2]?12:-4))+'" fill="#E3C9B8" font-size="10">'+nf(u[1],0)+"%</text>"+
    '<text x="'+(X(n-1)+6)+'" y="'+(Y(u[2])+(u[1]<u[2]?-4:12))+'" fill="#E3C9B8" font-size="10">'+nf(u[2],0)+"%</text>"+
    '<text x="'+L+'" y="'+(H-6)+'" fill="#A88C84" font-size="10">'+brCurto(s[0][0])+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" fill="#A88C84" font-size="10" text-anchor="end">'+brCurto(u[0])+"</text>"+
    '<line class="cruz" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="#A88C84" stroke-width="1" visibility="hidden"/></svg>';
}
function ligarGraficos(){
  document.querySelectorAll(".graf").forEach((el)=>{
    const x=SERIES[+el.dataset.i]; if(!x)return; const s=x.serie,n=s.length;
    const dica=document.createElement("div");dica.className="dica";dica.hidden=true;el.appendChild(dica);
    const mover=(ev)=>{
      const svg=el.querySelector("svg"),b=svg.getBoundingClientRect(),cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-b.left;
      const W=320,L=34,R=34,px=cx*W/b.width,i=Math.max(0,Math.min(n-1,Math.round((px-L)/((W-L-R)/(n-1||1)))));
      const xx=L+(W-L-R)*i/(n-1||1),cr=svg.querySelector(".cruz");cr.setAttribute("x1",xx);cr.setAttribute("x2",xx);cr.setAttribute("visibility","visible");
      dica.hidden=false;dica.style.left=(xx*b.width/W)+"px";dica.style.top="10px";
      dica.innerHTML=brCurto(s[i][0])+" · dia "+nf(s[i][1],0)+"% · acum. "+nf(s[i][2],0)+"%"+(s[i][1]<s[i][2]?' · <span style="color:var(--alerta)">abaixo</span>':"");
    };
    const sair=()=>{dica.hidden=true;const cr=el.querySelector(".cruz");if(cr)cr.setAttribute("visibility","hidden");};
    el.addEventListener("mousemove",mover);el.addEventListener("touchstart",mover,{passive:true});el.addEventListener("touchmove",mover,{passive:true});
    el.addEventListener("mouseleave",sair);el.addEventListener("touchend",()=>setTimeout(sair,1500));
  });
}

}

/* ===== nucleo animado ===== */
const cv=$("cv"),ctx=cv.getContext("2d");
let ESTADO="pronta",nivel=0,analisador=null,audioCtx=null,dadosAudio=null;
const ROTULO={pronta:"Pronta",ouvindo:"Ouvindo",pensando:"Pensando",falando:"Falando"};
function setEstado(e){ESTADO=e;$("estado").textContent=ROTULO[e]||"";}
function tam(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);cv.width=r.width*dpr;cv.height=r.height*dpr;}
window.addEventListener("resize",tam);
const calmo=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function quadro(t){
  /* 09/11 (ele: "o circulo esta oval"): o canvas nascia com o tamanho padrao (300 x 150) enquanto a tela estava escondida
     e nunca era refeito - o nucleo saia achatado. Agora confere o tamanho real a cada quadro e refaz quando muda. */
  {const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
   if(r.width>0&&(Math.abs(cv.width-r.width*dpr)>2||Math.abs(cv.height-r.height*dpr)>2))tam();}
  const W=cv.width,H=cv.height,cx=W/2,cy=H/2,R=Math.min(W,H)/2;
  ctx.clearRect(0,0,W,H);
  let alvo=0;
  if(ESTADO==="falando"&&analisador){analisador.getByteTimeDomainData(dadosAudio);let s=0;for(let i=0;i<dadosAudio.length;i++){const v=(dadosAudio[i]-128)/128;s+=v*v;}alvo=Math.min(1,Math.sqrt(s/dadosAudio.length)*4);}
  else if(ESTADO==="ouvindo")alvo=.35+.25*Math.sin(t/260);
  else if(ESTADO==="pensando")alvo=.25+.1*Math.sin(t/120);
  else alvo=.12+.06*Math.sin(t/900);
  nivel+=(alvo-nivel)*.18;
  const vel=calmo?0:(ESTADO==="pensando"?3.2:ESTADO==="ouvindo"?1.6:1);
  const rot=t/6000*vel;
  const TA=document.documentElement.classList.contains("tema-app");   /* 08/11: nucleo nas cores do app (verde e dourado) */
  const corA=TA?(ESTADO==="ouvindo"?"35,67,45":"184,148,79"):(ESTADO==="ouvindo"?"255,244,220":"232,181,74");
  /* brilho central */
  const rb=R*(.30+.12*nivel);
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rb*1.9);
  g.addColorStop(0,"rgba("+corA+","+(.55+.35*nivel)+")");g.addColorStop(.35,TA?"rgba(35,67,45,.35)":"rgba(158,27,27,.6)");g.addColorStop(1,TA?"rgba(247,244,236,0)":"rgba(14,5,5,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,rb*1.9,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="rgba("+corA+",.9)";ctx.lineWidth=R*.012;ctx.beginPath();ctx.arc(cx,cy,rb,0,Math.PI*2);ctx.stroke();
  /* aneis com segmentos */
  const aneis=[[.52,8,.08,1],[.64,3,.42,-.6],[.76,24,.025,.35],[.88,2,.62,-.25]];
  aneis.forEach(([f,n,arco,sent],k)=>{
    const r=R*f*(1+.04*nivel*(k%2?1:-1));
    ctx.strokeStyle=k%2?(TA?"rgba(35,67,45,.9)":"rgba(176,30,30,.95)"):(TA?"rgba(184,148,79,":"rgba(232,181,74,")+(.35+.4*nivel)+")";
    if(k===1)ctx.strokeStyle=TA?"rgba(110,139,94,.6)":"rgba(224,69,58,.6)";
    ctx.lineWidth=R*(k===2?.02:.008);
    for(let i=0;i<n;i++){const a=rot*sent*(ESTADO==="pensando"?2:1)+i*Math.PI*2/n;ctx.beginPath();ctx.arc(cx,cy,r,a,a+arco*Math.PI*2);ctx.stroke();}
  });
  /* ondas da fala */
  if(ESTADO==="falando"||ESTADO==="ouvindo"){
    ctx.strokeStyle="rgba("+corA+","+(.25+.4*nivel)+")";ctx.lineWidth=R*.006;ctx.beginPath();
    for(let i=0;i<=120;i++){const a=i/120*Math.PI*2,rr=R*(.40+.06*nivel*Math.sin(a*6+t/140)+.03*nivel*Math.sin(a*11-t/90));const x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.closePath();ctx.stroke();
  }
  /* marcas finas do mostrador */
  ctx.strokeStyle=TA?"rgba(35,67,45,.2)":"rgba(255,228,180,.2)";ctx.lineWidth=1;
  for(let i=0;i<72;i++){const a=i/72*Math.PI*2+rot*.2,r1=R*.95,r2=R*(i%6?.93:.9);ctx.beginPath();ctx.moveTo(cx+r1*Math.cos(a),cy+r1*Math.sin(a));ctx.lineTo(cx+r2*Math.cos(a),cy+r2*Math.sin(a));ctx.stroke();}
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);

/* ===== audio da Bia ===== */
let audioAtual=null,falar=true;
try{falar=localStorage.getItem("_bia_voz")!=="0";}catch(e){}
function marcarVoz(){$("voz").classList.toggle("off",!falar);$("voz").setAttribute("aria-label",falar?"Resposta falada ligada":"Resposta falada desligada");}
function destravarAudio(){
  if(audioCtx)return;
  try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();analisador=audioCtx.createAnalyser();analisador.fftSize=512;dadosAudio=new Uint8Array(analisador.fftSize);analisador.connect(audioCtx.destination);}catch(e){audioCtx=null;analisador=null;}
}
function pararAudio(){if(audioAtual){try{audioAtual.pause();}catch(e){}audioAtual=null;}if(ESTADO==="falando")setEstado("pronta");}
async function tocar(uri){
  pararAudio();
  const a=new Audio(uri); audioAtual=a;
  try{if(audioCtx){if(audioCtx.state==="suspended")await audioCtx.resume();audioCtx.createMediaElementSource(a).connect(analisador);}}catch(e){}
  a.onended=()=>{if(audioAtual===a){audioAtual=null;setEstado("pronta");}};
  setEstado("falando");
  try{await a.play();}catch(e){setEstado("pronta");}
}

/* ===== conversa ===== */
let ocupado=false;
async function perguntar(texto){
  texto=String(texto||"").trim(); if(!texto||ocupado)return;
  ocupado=true; pararAudio(); destravarAudio();
  $("ouvido").textContent="Você: "+texto; $("resposta").textContent=""; setEstado("pensando");
  try{
    const j=await chamar("web=1",{mensagem:texto,voz:falar});
    if(!j.ok){$("resposta").textContent=j.erro||"Não consegui responder agora.";setEstado("pronta");return;}
    $("resposta").textContent=j.texto||"";
    if(j.painel){carregar(j.painel);abrirPainel(j.painel,j.curral);}
    if(j.audio&&falar)await tocar(j.audio); else setEstado("pronta");
    if(MODO_CONVERSA&&!/^(obrigad|valeu|tchau|pode parar|parar|so isso|só isso|chega|até mais|ate mais)/i.test(texto))continuarConversa(j.audio&&falar);
  }catch(e){if(e.message!=="login"){$("resposta").textContent="Sem conexão com a Bia agora. Tenta de novo.";}setEstado("pronta");}
  finally{ocupado=false;}
}

/* modo conversa: volta a ouvir quando a Bia termina de falar (ou logo, se a resposta foi so texto) */
function continuarConversa(temAudio){
  const vai=()=>{if(MODO_CONVERSA&&!ouvindo&&!ocupado)ouvir();};
  if(temAudio&&audioAtual){const a=audioAtual;const fim=a.onended;a.onended=(e)=>{if(fim)fim(e);setTimeout(vai,250);};}
  else setTimeout(vai,600);
}
/* ===== microfone (reconhecimento de voz do navegador, pt-BR) ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,ouvindo=false,parcial="";
function ouvir(){
  destravarAudio();
  if(!SR){$("ouvido").textContent="Este navegador não reconhece voz. Use o Chrome, ou escreva.";return;}
  if(ouvindo){try{rec.stop();}catch(e){}return;}
  pararAudio(); fecharPainel();
  rec=new SR(); rec.lang="pt-BR"; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
  parcial="";
  rec.onstart=()=>{ouvindo=true;$("mic").classList.add("ouvindo");setEstado("ouvindo");$("ouvido").textContent="Pode falar…";};
  rec.onresult=(ev)=>{let fin="",tmp="";for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=r[0].transcript;else tmp+=r[0].transcript;}if(fin)parcial+=fin;$("ouvido").textContent=(parcial+tmp)||"Pode falar…";};
  rec.onerror=(ev)=>{if(ev.error==="not-allowed")$("ouvido").textContent="Libere o microfone para esta página nas configurações do navegador.";else if(ev.error==="no-speech"){$("ouvido").textContent=MODO_CONVERSA?"Fiquei em silêncio. Toque no microfone ou diga \"Bia\" para chamar de novo.":"Não ouvi nada. Toque de novo.";MODO_CONVERSA=false;}};
  rec.onend=()=>{ouvindo=false;$("mic").classList.remove("ouvindo");if(ESTADO==="ouvindo")setEstado("pronta");const t=parcial.trim();if(t)perguntar(t);};
  try{rec.start();}catch(e){ouvindo=false;}
}

/* ===== conversa AO VIVO (05/11, ele: "quero poder conversar com ela, igual a ferramenta do ChatGPT que faz por
   audio sem interrupcoes"). WebRTC direto na Realtime API da OpenAI, com chave temporaria pedida a Bia
   (?web=1&realtime=1). Ouve e fala ao mesmo tempo; se ele fala por cima, ela para. Pergunta de dados vem como
   ferramenta consultar_bia, que vai para a rota ?web=1 de sempre (sem audio) e volta como resultado. */
const AV={pc:null,dc:null,mic:null,som:null,ativo:false};
async function aoVivoLigar(){
  if(AV.ativo){aoVivoDesligar();return;}
  pararAudio(); if(ouvindo){try{rec.stop();}catch(e){}}
  MODO_CONVERSA=false; destravarAudio();
  $("aovivo").classList.add("on"); $("aovivo").textContent="■ Encerrar";
  $("ouvido").textContent=""; $("resposta").textContent="Ligando…"; setEstado("pensando");
  try{
    /* 06/11: dentro do app Android, o audio vai pelo app (biometria: so a voz do chefe chega na Bia) */
    let NATIVO=false;try{NATIVO=!!(window.BiaApp&&BiaApp.nativo&&BiaApp.nativo());}catch(e){}
    if(NATIVO){
      const jn=await chamar("web=1&realtime=1&nativo=1",{});
      if(!jn.ok)throw new Error(jn.erro||"não consegui ligar");
      AV.ativo=true;AV.nativo=true;AV.inicio=Date.now();aoVivoAtividade();
      BiaApp.iniciar(jn.chave,jn.modelo||"gpt-realtime-2.1");
      return;
    }
    const j=await chamar("web=1&realtime=1",{});
    if(!j.ok)throw new Error(j.erro||"não consegui ligar");
    const pc=new RTCPeerConnection(); AV.pc=pc; AV.ativo=true; AV.inicio=Date.now();
    const som=new Audio(); som.autoplay=true; AV.som=som;
    pc.ontrack=(e)=>{som.srcObject=e.streams[0];
      /* analisador proprio, sem ligar no alto-falante (o som ja sai pelo <audio>; ligar no destino tocaria em dobro) */
      try{if(audioCtx){if(audioCtx.state==="suspended")audioCtx.resume();const an=audioCtx.createAnalyser();an.fftSize=512;audioCtx.createMediaStreamSource(e.streams[0]).connect(an);AV.anVelho=analisador;analisador=an;}}catch(_){}};
    AV.mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    pc.addTrack(AV.mic.getTracks()[0]);
    const dc=pc.createDataChannel("oai-events"); AV.dc=dc;
    dc.onopen=()=>{aoVivoAtividade();setEstado("ouvindo");$("resposta").textContent="Pode falar, chefe.";
      dc.send(JSON.stringify({type:"response.create",response:{instructions:"Cumprimente o chefe em uma frase curta e animada e pergunte em que pode ajudar."}}));};
    dc.onmessage=(m)=>{try{aoVivoEvento(JSON.parse(m.data));}catch(e){console.warn(e);}};
    pc.onconnectionstatechange=()=>{if(["failed","closed","disconnected"].includes(pc.connectionState)&&AV.ativo)aoVivoDesligar("A conexão caiu. Toque em Ao vivo de novo.");};
    const oferta=await pc.createOffer(); await pc.setLocalDescription(oferta);
    const r=await fetch("https://api.openai.com/v1/realtime/calls",{method:"POST",body:oferta.sdp,headers:{Authorization:"Bearer "+j.chave,"Content-Type":"application/sdp"}});
    if(!r.ok)throw new Error("a OpenAI recusou ("+r.status+")");
    await pc.setRemoteDescription({type:"answer",sdp:await r.text()});
  }catch(e){
    if(e.message!=="login")aoVivoDesligar(/Permission|NotAllowed/i.test(String(e&&e.name||e))?"Libere o microfone para esta página.":"Não consegui ligar a conversa ao vivo: "+(e.message||e));
  }
}
/* 06/11: 60 s sem ninguem falar, a conversa desliga sozinha (economiza bateria) */
let avInativo=null;
function aoVivoAtividade(){clearTimeout(avInativo);avInativo=setTimeout(()=>{if(AV.ativo)aoVivoDesligar("Encerrei por falta de conversa. É só chamar.");},60000);}
function aoVivoDesligar(msg){
  clearTimeout(avInativo);
  const eraAtivo=AV.ativo;
  /* 06/11: quanto durou (custo da voz na Bia) */
  if(eraAtivo&&AV.inicio){const seg=Math.round((Date.now()-AV.inicio)/1000);AV.inicio=0;try{chamar("web=1&aovivo_fim=1",{seg});}catch(e){}}
  AV.ativo=false;
  if(AV.nativo){try{BiaApp.parar();}catch(e){}AV.nativo=false;}
  try{AV.dc&&AV.dc.close();}catch(e){} try{AV.pc&&AV.pc.close();}catch(e){}
  try{AV.mic&&AV.mic.getTracks().forEach((t)=>t.stop());}catch(e){}
  try{if(AV.som){AV.som.srcObject=null;}}catch(e){}
  if(AV.anVelho){analisador=AV.anVelho;AV.anVelho=null;}
  AV.pc=AV.dc=AV.mic=AV.som=null;
  $("aovivo").classList.remove("on"); $("aovivo").textContent="● Ao vivo";
  setEstado("pronta"); if(msg)$("resposta").textContent=msg;
  /* dentro do app Android (chamada pela voz/gesto), fecha a tela e a escuta da palavra "Bia" volta */
  if(eraAtivo&&AO_VIVO_AUTO&&window.BiaApp&&BiaApp.fechar)setTimeout(()=>{try{BiaApp.fechar();}catch(e){}},1200);
}
let avFala="";
function avEnviar(o){const t=JSON.stringify(o);if(AV.nativo){try{BiaApp.enviar(t);}catch(e){}}else if(AV.dc&&AV.dc.readyState==="open")AV.dc.send(t);}
/* eventos que o app manda (os da OpenAI repassados + os "nativo.*" do proprio app) */
function aoVivoNativo(txt){
  let ev;try{ev=JSON.parse(txt);}catch(e){return;}
  const t=ev.type||"";
  if(t==="nativo.estado"){setEstado(ev.valor);if(ev.valor!=="pensando")aoVivoAtividade();return;}
  if(t==="nativo.ignorado"){$("ouvido").textContent="(voz não reconhecida, ignorei)";return;}
  if(t==="nativo.erro"){aoVivoDesligar(String(ev.valor||"erro"));return;}
  aoVivoEvento(ev);
}
async function aoVivoEvento(ev){
  const t=ev.type||"";
  if(t==="input_audio_buffer.speech_started"||t==="output_audio_buffer.started"||t==="response.function_call_arguments.done")aoVivoAtividade();
  if(t==="input_audio_buffer.speech_started"){setEstado("ouvindo");}
  else if(t==="conversation.item.input_audio_transcription.completed"){$("ouvido").textContent="Você: "+(ev.transcript||"").trim();}
  else if(t==="response.created"){avFala="";}
  else if(t==="response.output_audio_transcript.delta"||t==="response.audio_transcript.delta"){avFala+=ev.delta||"";$("resposta").textContent=avFala;}
  else if(t==="output_audio_buffer.started"){setEstado("falando");}
  else if(t==="output_audio_buffer.stopped"||t==="output_audio_buffer.cleared"){if(AV.ativo)setEstado("ouvindo");}
  else if(t==="response.function_call_arguments.done"&&ev.name==="consultar_bia"){
    let q="";try{q=JSON.parse(ev.arguments||"{}").pergunta||"";}catch(e){}
    setEstado("pensando");
    let saida="";
    try{const j=await chamar("web=1",{mensagem:q,voz:false});
      saida=j.ok?(j.texto||""):("erro: "+(j.erro||"sem resposta"));
      if(j.ok&&j.painel){carregar(j.painel);abrirPainel(j.painel,j.curral);}
    }catch(e){saida="erro: sem conexão com a Bia";}
    if(!AV.ativo)return;
    avEnviar({type:"conversation.item.create",item:{type:"function_call_output",call_id:ev.call_id,output:saida.slice(0,6000)}});
    avEnviar({type:"response.create"});
  }
  else if(t==="response.function_call_arguments.done"&&ev.name==="encerrar_conversa"){
    /* 06/11 17h50 (ele: "quando eu falar para parar, ela pare. E ai economiza bateria"): deixa ela dizer "ate mais" e desliga */
    avEnviar({type:"conversation.item.create",item:{type:"function_call_output",call_id:ev.call_id,output:"ok"}});
    setTimeout(()=>aoVivoDesligar("Até mais, chefe."),1800);
  }
    else if(t==="error"){console.warn("ao vivo:",ev.error);if(ev.error&&/expired|session/i.test(ev.error.message||""))aoVivoDesligar("A sessão expirou. Toque em Ao vivo de novo.");}
}
$("aovivo").onclick=aoVivoLigar;
/* 08/11: o app Caiman Gestao (iframe) liga e encerra a conversa ao vivo pelos botoes dele e, ao fechar a Bia, encerra

window.biaAoVivoLigar=function(){if(!AV.ativo)aoVivoLigar();};
window.biaAoVivoEncerrar=function(){if(AV.ativo)aoVivoDesligar();};

document.addEventListener("keydown",(e)=>{if(e.key==="Escape"&&!$("tela").hidden)fecharPainel();});
