# 31/10/2026: compila o app Android "Bia ouvindo" (palavra de ativacao "Bia") e publica o APK numa release do GitHub
# para ele baixar no celular. Roda quando android-bia/ muda ou pelo botao "Run workflow".
name: App Android da Bia
on:
  push:
    paths: ["android-bia/**", ".github/workflows/android-bia.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - name: Modelo de voz em ingles (Vosk, offline) - palavra de ativacao "Friday"
        run: |
          curl -sSL -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q m.zip
          mkdir -p android-bia/app/src/main/assets/model-en
          cp -r vosk-model-small-en-us-0.15/* android-bia/app/src/main/assets/model-en/
          echo "en-us-0.15" > android-bia/app/src/main/assets/model-en/uuid
      - name: Compilar
        working-directory: android-bia
        run: gradle --no-daemon assembleRelease
      - name: Publicar o APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android-bia/app/build/outputs/apk/release/app-release.apk Friday.apk
          gh release delete bia-android -y --cleanup-tag || true
          gh release create bia-android Friday.apk -t "Friday (Android)" -n "App Android com a palavra de ativacao Friday. Instale no celular e ligue a escuta."
